<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="isoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#082A4D"/>
    </linearGradient>
    <linearGradient id="isoRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="isoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="#FFFFFF" stroke="url(#isoRing)" stroke-width="5" filter="url(#isoShadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#93C5FD" stroke-width="1.2"/>
  
  <!-- Curved Text Top -->
  <path id="isoTopPath" d="M 28 80 A 52 52 0 0 1 132 80" fill="none"/>
  <text font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#0F4C81" letter-spacing="1.2">
    <textPath href="#isoTopPath" startOffset="50%" text-anchor="middle">★ QUALITY MANAGEMENT SYSTEM ★</textPath>
  </text>
  
  <!-- Center Globe Mesh + ISO Text -->
  <circle cx="80" cy="80" r="42" fill="#F8FAFC" stroke="#0F4C81" stroke-width="2"/>
  
  <!-- Subtle Globe Lines -->
  <ellipse cx="80" cy="80" rx="42" ry="16" fill="none" stroke="#CBD5E1" stroke-width="0.8"/>
  <ellipse cx="80" cy="80" rx="18" ry="42" fill="none" stroke="#CBD5E1" stroke-width="0.8"/>
  
  <text x="80" y="74" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0F4C81" text-anchor="middle" letter-spacing="1">ISO</text>
  <text x="80" y="88" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#2563EB" text-anchor="middle" letter-spacing="1.2">9001:2015</text>
  <text x="80" y="100" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="2">CERTIFIED</text>
  
  <!-- Bottom Ribbon Label -->
  <g transform="translate(80, 138)">
    <rect x="-44" y="-9" width="88" height="18" rx="3" fill="#0F4C81" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="0" y="3.5" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ISO 9001:2015</text>
  </g>
</svg>
