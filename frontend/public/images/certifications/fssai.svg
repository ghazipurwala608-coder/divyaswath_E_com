<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="fssaiOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="fssaiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755"/>
      <stop offset="30%" stop-color="#FFF3C4"/>
      <stop offset="60%" stop-color="#C28D28"/>
      <stop offset="100%" stop-color="#8F6212"/>
    </linearGradient>
    <filter id="fssaiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="80" cy="80" r="76" fill="#FFFFFF" stroke="url(#fssaiGold)" stroke-width="5" filter="url(#fssaiShadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#FDBA74" stroke-width="1.2"/>
  
  <!-- Central FSSAI text & emblem -->
  <g transform="translate(80, 68)">
    <text x="-4" y="8" font-family="Georgia, serif" font-size="28" font-style="italic" font-weight="900" fill="#0D3B66" letter-spacing="-1.5" text-anchor="middle">fssai</text>
    <!-- Leaf on the dot of 'i' -->
    <path d="M18,-14 C26,-22 28,-14 26,-8 C20,-4 18,-10 18,-14 Z" fill="#65A30D"/>
    <path d="M22,-8 C27,-4 26,0 23,2 C19,2 18,-4 22,-8 Z" fill="#EA580C"/>
  </g>
  
  <text x="80" y="96" font-family="system-ui, sans-serif" font-size="5.8" font-weight="800" fill="#0D3B66" text-anchor="middle" letter-spacing="0.4">FOOD SAFETY AND STANDARDS</text>
  <text x="80" y="104" font-family="system-ui, sans-serif" font-size="5.8" font-weight="800" fill="#0D3B66" text-anchor="middle" letter-spacing="0.4">AUTHORITY OF INDIA</text>
  
  <!-- Bottom Ribbon Label -->
  <g transform="translate(80, 138)">
    <rect x="-44" y="-9" width="88" height="18" rx="3" fill="url(#fssaiOrange)" stroke="#C2410C" stroke-width="1"/>
    <text x="0" y="3.5" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">FSSAI LICENSED</text>
  </g>
</svg>
