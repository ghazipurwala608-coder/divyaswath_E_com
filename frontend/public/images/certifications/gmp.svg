<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gmpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755"/>
      <stop offset="30%" stop-color="#FFF3C4"/>
      <stop offset="60%" stop-color="#C28D28"/>
      <stop offset="100%" stop-color="#8F6212"/>
    </linearGradient>
    <linearGradient id="gmpInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08381D"/>
      <stop offset="100%" stop-color="#031A0D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#gmpInner)" stroke="url(#gmpGold)" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="url(#gmpGold)" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Curved Text Top -->
  <path id="gmpTopPath" d="M 28 80 A 52 52 0 0 1 132 80" fill="none"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#EBD287" letter-spacing="1.4">
    <textPath href="#gmpTopPath" startOffset="50%" text-anchor="middle">GOOD MANUFACTURING PRACTICE</textPath>
  </text>
  
  <!-- Central Badge Plate -->
  <circle cx="80" cy="80" r="44" fill="#0E4525" stroke="url(#gmpGold)" stroke-width="2"/>
  <circle cx="80" cy="80" r="41" fill="#052613" stroke="#85B562" stroke-width="0.8"/>
  
  <!-- Main GMP Text -->
  <text x="80" y="73" font-family="Georgia, serif" font-size="23" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">GMP</text>
  <text x="80" y="85" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#E2B755" text-anchor="middle" letter-spacing="2.5">CERTIFIED</text>
  
  <!-- Twin Green Leaves Icon -->
  <g transform="translate(80, 102) scale(0.75)">
    <path d="M0,0 C-10,-12 -12,-20 0,-24 C12,-20 10,-12 0,0 Z" fill="#69A838"/>
    <path d="M0,0 C-7,-8 -8,-14 0,-18 C7,-14 6,-8 0,0 Z" fill="#88CF4C"/>
    <path d="M0,-2 L0,-22" stroke="#052613" stroke-width="1"/>
  </g>
  
  <!-- Bottom Ribbon Label -->
  <g transform="translate(80, 138)">
    <rect x="-42" y="-9" width="84" height="18" rx="3" fill="#0E4525" stroke="url(#gmpGold)" stroke-width="1.2"/>
    <text x="0" y="3.5" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GMP CERTIFIED</text>
  </g>
</svg>
